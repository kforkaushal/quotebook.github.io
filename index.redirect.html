<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://quotebook.me/">
  <!-- GitHub Pages cannot issue server-side 301s. This page provides a
       client-side redirect for the /index path (no extension) which would
       otherwise 404. The canonical tag ensures Google attributes ranking
       signals to the clean / URL. -->
  <script>window.location.replace("/");</script>
</head>
<body>
  <p>Redirecting to <a href="/">Quotebook</a>…</p>
</body>
</html>
